<body>
    <!DOCTYPE html>
    <html lang="uz">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
        <title>NovaStore</title>
    
        <link rel="stylesheet" href="./main.css">
    
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
            rel="stylesheet">
    </head>
    
    <body>
    
        <header class="header">
    
            <div class="logo">
                NovaStore
            </div>
    
            <nav class="nav">
                <a href="#">Home</a>
                <a href="#">Products</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>
    
            <div class="cart-btn">
                🛒 <span id="cartCount">0</span>
            </div>
    
        </header>
    
        <section class="hero">
    
            <div class="hero-content">
                <h1>Modern E-Commerce Website</h1>
    
                <p>
                    HTML CSS va JavaScript yordamida yaratilgan professional loyiha.
                </p>
    
                <button>
                    Shop Now
                </button>
            </div>
    
        </section>
    
        <section class="products-section">
    
            <div class="section-title">
                <h2>Popular Products</h2>
            </div>
    
            <div class="products" id="products"></div>
    
        </section>
    
        <section class="newsletter">
    
            <h2>Subscribe Newsletter</h2>
    
            <p>Yangi mahsulotlardan birinchi bo‘lib xabardor bo‘ling.</p>
    
            <div class="newsletter-box">
                <input type="email" placeholder="Email kiriting">
                <button>Subscribe</button>
            </div>
    
        </section>
    
        <footer class="footer">
            <p>© 2026 NovaStore. All rights reserved.</p>
        </footer>
    
        <script src="./main.js"></script>
    
    </body>
    
    </html>
</body>
</html>
